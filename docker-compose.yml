services:
  juiceshop:
    image: bkimminich/juice-shop:latest
    pull_policy: never
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - test-network
  mailcatcher:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_MAX_MESSAGES=5000
    networks:
      - test-network
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - APP_URL=http://juiceshop:3000
      - MAIL_API_URL=http://mailcatcher:8025/api/v1
    depends_on:
      - juiceshop
      - mailcatcher
    networks:
      - test-network
    command: ["tail", "-f", "/dev/null"]
networks:
  test-network:
    driver: bridge